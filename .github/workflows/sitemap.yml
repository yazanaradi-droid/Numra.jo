name: Update sitemap
on:
  schedule:
    - cron: '23 */6 * * *'   # every 6 hours
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: sitemap
  cancel-in-progress: false
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild sitemap.xml from the public feed
        run: node tools/gen-sitemap.mjs
      - name: Commit and publish only if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- sitemap.xml; then echo "sitemap unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Update sitemap"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "pages build request skipped"
