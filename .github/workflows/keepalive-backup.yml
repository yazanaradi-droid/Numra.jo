name: keep-alive and backup
on:
  schedule:
    - cron: '17 3 */3 * *'     # every 3 days: keeps the free Supabase project from pausing
  workflow_dispatch:
permissions:
  contents: write
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the public ads (keeps Supabase awake) and save a backup copy
        run: |
          mkdir -p backups
          curl -sS --fail "https://xfkahevdccmogaxboffy.supabase.co/rest/v1/xp_listings?select=*&order=created_at.desc&limit=1000" \
            -H "apikey: sb_publishable_RjEelulxPpEmHc5IJsdGJw_urv20frx" -o backups/listings.json
          python3 -c "import json;d=json.load(open('backups/listings.json'));print(len(d),'ads backed up')"
      - name: Commit the backup if it changed
        run: |
          git config user.name "backup-bot"; git config user.email "backup-bot@users.noreply.github.com"
          git add backups/listings.json
          git diff --cached --quiet || (git commit -m "Backup of ads" && git push)
