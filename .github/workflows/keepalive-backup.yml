name: keep-alive and backup
on:
  schedule:
    - cron: '17 3 */3 * *'     # every 3 days: keeps the free Supabase project from pausing
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the public ads (keeps Supabase awake) and save a backup copy
        run: |
          mkdir -p backups
          curl -sS --fail "https://xfkahevdccmogaxboffy.supabase.co/rest/v1/xp_listings?select=id,type,code,number,value,price,created_at&order=created_at.desc&limit=1000" \
            -H "apikey: sb_publishable_RjEelulxPpEmHc5IJsdGJw_urv20frx" -o backups/listings.json
          python3 -c "import json;d=json.load(open('backups/listings.json'));print(len(d),'ads backed up')"
      - name: Keep the backup as a private workflow artifact (not published in the repo)
        uses: actions/upload-artifact@v4
        with:
          name: ads-backup
          path: backups/listings.json
          retention-days: 90
