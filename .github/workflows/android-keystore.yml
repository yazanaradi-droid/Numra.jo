name: Android upload key (run once)
on: workflow_dispatch
jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Generate the upload keystore and a random password
        run: |
          set -eo pipefail
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore upload.jks -storetype PKCS12 -storepass "$PASS" -keypass "$PASS" \
            -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Souq Al Arqam, O=Souq Al Arqam, C=JO"
          base64 -w0 upload.jks > keystore.b64
          printf 'ANDROID_KEY_ALIAS=upload\nANDROID_KEYSTORE_PASSWORD=%s\n' "$PASS" > secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-upload-key
          path: |
            keystore.b64
            secrets.txt
            upload.jks
          retention-days: 1
