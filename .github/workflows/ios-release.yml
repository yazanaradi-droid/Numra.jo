name: iOS release (sign + upload to TestFlight)
# Manual only. Needs three repository secrets (added by the owner, never in the code):
#   ASC_KEY_ID      the Key ID of the App Store Connect API key (souqalarqam-ci)
#   ASC_ISSUER_ID   the Issuer ID shown on the Integrations page
#   ASC_KEY_P8      the full text of the AuthKey_XXXX.p8 file
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: macos-latest
    env:
      TEAM_ID: WY865D7959
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - run: npm install --no-audit --no-fund
      - run: node scripts/build-www.js
      - run: npx cap add ios
      - run: npx capacitor-assets generate --ios --iconBackgroundColor '#F0F6FF' --splashBackgroundColor '#F0F6FF' --splashBackgroundColorDark '#F0F6FF'
      - run: npx cap sync ios
      - name: Declare that the app uses only exempt encryption (HTTPS)
        working-directory: mobile
        run: /usr/libexec/PlistBuddy -c 'Add :ITSAppUsesNonExemptEncryption bool false' ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c 'Set :ITSAppUsesNonExemptEncryption false' ios/App/App/Info.plist
      - name: Write the App Store Connect key
        env: { ASC_KEY_P8: '${{ secrets.ASC_KEY_P8 }}', ASC_KEY_ID: '${{ secrets.ASC_KEY_ID }}' }
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"
      - name: Archive (unsigned; Apple signs it at export, so no test device is needed)
        working-directory: mobile/ios/App
        run: |
          set -eo pipefail
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION="${{ github.run_number }}" archive | tail -40
      - name: Export and upload to App Store Connect
        working-directory: mobile/ios/App
        env: { ASC_KEY_ID: '${{ secrets.ASC_KEY_ID }}', ASC_ISSUER_ID: '${{ secrets.ASC_ISSUER_ID }}' }
        run: |
          set -eo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40
